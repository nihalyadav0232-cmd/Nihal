<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Racer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <div class="top-bar">
            <div>🏆 Score: <span id="score">0</span></div>
            <div>⚡ Speed: <span id="speed">1</span></div>
        </div>

        <div id="game">

            <div class="road-line line1"></div>
            <div class="road-line line2"></div>
            <div class="road-line line3"></div>
            <div class="road-line line4"></div>

            <div id="player" class="car">🚘</div>
            <div id="enemy" class="car enemy">🚙</div>

        </div>

        <div class="controls">
            <button id="leftBtn">⬅</button>
            <button id="rightBtn">➡</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
