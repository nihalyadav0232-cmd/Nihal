<!DOCTYPE html>
<html>
<head>
    <title>Car Racing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🏎️ Car Racing Game</h1>

    <div id="game">
        <div class="roadLine line1"></div>
<div class="roadLine line2"></div>
<div class="roadLine line3"></div>
        <div id="player"></div>

        <button id="rightBtn">RIGHT ➡️</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
